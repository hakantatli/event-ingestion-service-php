version: "3.8"

services:
  php-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-event-ingestion-api
    # volumes:
    #   - .:/app
    ports:
      - "8080:8000"
    command: ["php", "artisan", "octane:start", "--server=frankenphp", "--host=0.0.0.0", "--port=8000", "--workers=64"]
    environment:
      - APP_ENV=local
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      # Cache: "array" driver is per-worker in-memory — zero network overhead.
      # Metrics are already short-lived (10 s TTL), so array is perfectly fine.
      - CACHE_STORE=array
      # No sessions — this is a stateless JSON API.
      - SESSION_DRIVER=array
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=64
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USERNAME=event_user
      - CLICKHOUSE_PASSWORD=event_password
      - CLICKHOUSE_DATABASE=events_db
    depends_on:
      - clickhouse

  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    container_name: laravel-event-ingestion-clickhouse
    ports:
      - "8123:8123" # HTTP port
      - "9000:9000" # Native port
    environment:
      - CLICKHOUSE_USER=event_user
      - CLICKHOUSE_PASSWORD=event_password
      - CLICKHOUSE_DB=events_db
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
